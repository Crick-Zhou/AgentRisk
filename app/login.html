<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登录 · 智鉴 AgentRisk</title><link rel="stylesheet" href="/login.css"></head>
<body><main class="login-card"><div class="brand">智鉴 <strong>AgentRisk</strong></div><div class="eyebrow">PRIVATE WORKSPACE</div><h1>登录测评工作台</h1><p class="intro">仅限授权访问。登录后可使用双模型测评、查看执行证据并导出报告。</p><form id="loginForm"><label for="username">账号</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required><p id="loginError" role="alert" aria-live="polite"></p><button id="loginButton" type="submit">登录</button></form><p class="footnote">API 密钥由服务器保管，无需在此输入。<br>请勿与他人共享登录密码。</p></main><script type="module" src="/login.js"></script></body>
</html>
